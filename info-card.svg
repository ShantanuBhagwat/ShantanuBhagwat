<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 188" width="490" height="188">

    <style>
      svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      :root {
        --panel-bg: #0d1117; --header-bg: #161b22; --border: #30363d;
        --title: #8b949e; --label: #79c0ff; --value: #c9d1d9;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --panel-bg: #f6f8fa; --header-bg: #eaeef2; --border: #d0d7de;
          --title: #57606a; --label: #0969da; --value: #24292f;
        }
      }
      .panel { fill: var(--panel-bg); stroke: var(--border); stroke-width: 1; }
      .header { fill: var(--header-bg); }
      .dot-red { fill: #ff5f56; } .dot-yellow { fill: #ffbd2e; } .dot-green { fill: #27c93f; }
      .title { fill: var(--title); font-size: 12px; }
      .label { fill: var(--label); font-size: 13px; font-weight: 600; }
      .value { fill: var(--value); font-size: 13px; }
      .row { opacity: 0; }
      @keyframes lineIn {
        0%   { opacity: 0; transform: translateX(-6px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      .row { animation: lineIn 0.4s ease-out forwards; }
    </style>
    
<rect class="panel" x="0.5" y="0.5" width="489" height="187" rx="8" ry="8" />

    <rect class="header" x="0" y="0" width="490" height="34" rx="8" ry="8" />
    <rect class="header" x="0" y="26" width="490" height="8" />
    <circle class="dot-red" cx="18" cy="17.0" r="5.5" />
    <circle class="dot-yellow" cx="36" cy="17.0" r="5.5" />
    <circle class="dot-green" cx="54" cy="17.0" r="5.5" />
    <text class="title" x="245.0" y="21.0" text-anchor="middle">shantanu@github ~</text>
    
<g class="row" style="animation-delay:0.35s"><text class="label" x="20" y="62">Now</text><text class="value" x="128" y="62">B.Tech CSE @ VIT Vellore, class of 2027</text></g><g class="row" style="animation-delay:0.51s"><text class="label" x="20" y="96">Prev</text><text class="value" x="128" y="96">SDE Intern @ NCDEX - AP Revamp project</text></g><g class="row" style="animation-delay:0.67s"><text class="label" x="20" y="130">Stack</text><text class="value" x="128" y="130">Java, Python, React, Node, Spring Boot</text></g><g class="row" style="animation-delay:0.83s"><text class="label" x="20" y="164">Highlights</text><text class="value" x="128" y="164">Patent published + AI anomaly detection</text></g>
</svg>